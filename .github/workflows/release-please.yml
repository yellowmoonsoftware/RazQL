name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Update release pull request or create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Changes made with GITHUB_TOKEN do not trigger pull_request workflows.
      # workflow_dispatch is the supported exception and checks the release PR head.
      - name: Check release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName' <<< "$RELEASE_PR")"
          test -n "$branch" && test "$branch" != 'null'
          gh workflow run ci.yml --ref "$branch"
