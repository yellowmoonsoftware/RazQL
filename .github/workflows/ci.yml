name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RazQL.slnx

      - name: Build
        run: dotnet build RazQL.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazQL.slnx --configuration Release --no-build

      - name: Verify packages
        run: ./eng/test-packages.sh
