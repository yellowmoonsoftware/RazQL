name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.100', '10.0.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Pin minimum SDK
        if: matrix.sdk == '10.0.100'
        run: |
          printf '%s\n' '{"sdk":{"version":"10.0.100","rollForward":"disable"}}' > global.json
          test "$(dotnet --version)" = '10.0.100'

      - name: Restore
        run: dotnet restore RazQL.slnx

      - name: Build
        run: dotnet build RazQL.slnx --configuration Release --no-restore -warnaserror:CS8619

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: dotnet test RazQL.slnx --configuration Release --no-build

      - name: Verify packages
        run: ./eng/test-packages.sh

  report-release-pr-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report aggregate result on release PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [[ "$CI_RESULT" == 'success' ]]; then
            state='success'
          else
            state='failure'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='RazQL CI' \
            -f description="Build, tests, and package verification: $CI_RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$CI_RESULT" == 'success'
